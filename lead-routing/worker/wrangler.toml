name = "momos-lead-routing"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# One log line per lead in the dashboard: Worker > Observability > Logs.
[observability]
enabled = true

# Run next to Claude's API instead of next to the visitor. Cloudflare otherwise runs the
# Worker in the visitor's nearest data center, and some (Hong Kong, for visitors in
# Vietnam) are in regions the Claude API refuses with "403 Request not allowed".
[placement]
mode = "targeted"
hostname = "api.anthropic.com"

[vars]
JAMES_URL = "https://calendar.app.google/LxFWWodxZMcd957n6"
JILL_URL = "https://calendar.app.google/RgDyFpMoE46wfyFv9"
NOT_FIT_URL = "https://www.momos.com/thank-you"
ALLOWED_ORIGINS = "https://www.momos.com,https://momos.com"
# Which Claude researches each lead in the background: "haiku" (cheap) or "opus" (thorough).
RESEARCH_MODEL = "haiku"
# Lead notifier (src/notify.ts): every 30 minutes, Beacon posts the leads reps added to Salesforce
# by hand to this Slack channel. It stays off until the SF_* and SLACK_BOT_TOKEN secrets are set
# (see the bottom of this file).
SF_DOMAIN = "fun-ruby-7024.my.salesforce.com"
SLACK_CHANNEL = "top-funnel-deal"
LEAD_SOURCE_FIELD = "LeadSource"
LEAD_LOCATIONS_FIELD = "NoofOutlets__c"
# Salesforce users whose leads are never posted. Momos Marketing is the demo form's automation:
# those Inbound leads already reach Slack through Zapier.
SKIP_CREATORS = "Momos Marketing"
# More than this many leads from one person in a run is an import: one line instead of each lead.
BULK_LIMIT = "10"
# Who inbound alerts tag: "James=<Slack member ID or email>,Jill=<Slack member ID or email>".
# An email is looked up in Slack (Beacon needs users:read.email). Empty: the post shows the name.
AE_SLACK = ""
# Who gets the daily check (src/inbound.ts) as a Beacon DM: Slack member IDs or emails, comma
# separated. Empty: it goes to the inbound channel.
DAILY_REPORT_TO = ""

# Repeat submissions (7 days) and the daily counts for the health check. Cloudflare creates the
# store on the first deploy (no id needed here).
[[kv_namespaces]]
binding = "LEADS"

# Cloudflare only runs crons on the live deployment, not on Previews.
[triggers]
# "*/30 * * * *": the lead notifier. If you change it, change WINDOW_MS in src/notify.ts to match.
# "0 1 * * *": the daily health check and turned-away roll-up (DAILY_CRON in src/index.ts).
# "*/5 * * * *": research retries for leads Claude couldn't research in time (RETRY_CRON).
crons = ["*/30 * * * *", "0 1 * * *", "*/5 * * * *"]

# At most 5 form submissions a minute from one IP address. Extra ones get the popup without
# calling Claude or Zapier, so a bot can't flood Slack and Salesforce.
[[ratelimits]]
name = "SUBMIT_LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Cloudflare's builds require settings for Preview deployments (test copies built from
# non-main branches). These are only links and site names, safe to share with Previews.
# Keep them in step with [vars] above.
[previews.vars]
JAMES_URL = "https://calendar.app.google/LxFWWodxZMcd957n6"
JILL_URL = "https://calendar.app.google/RgDyFpMoE46wfyFv9"
NOT_FIT_URL = "https://www.momos.com/thank-you"
ALLOWED_ORIGINS = "https://www.momos.com,https://momos.com"
RESEARCH_MODEL = "haiku"

[previews.placement]
mode = "targeted"
hostname = "api.anthropic.com"

[[previews.ratelimits]]
name = "SUBMIT_LIMIT"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

# Secrets (set in Cloudflare: Worker > Settings > Variables and Secrets, never commit):
#   ANTHROPIC_API_KEY   required
#   ZAPIER_HOOK_URL     optional. When set, Claude researches each lead after the redirect
#                       and sends the result to Zapier (Salesforce + Slack).
#   SF_CLIENT_ID        lead notifier: Salesforce External Client App, client-credentials flow,
#   SF_CLIENT_SECRET    read-only integration user (Lead read). SF_DOMAIN is above.
#   INBOUND_SLACK_CHANNEL  inbound alerts (src/inbound.ts): the inbound leads channel's ID (C...),
#                       the one the Zapier Slack step posts to. Kept out of this public file.
#                       Without it, demo requests aren't posted by the Worker.
#   SLACK_BOT_TOKEN     lead notifier: Beacon's bot token (xoxb-...). Scopes: chat:write, and
#                       users:read.email to mention the lead owner. Invite Beacon to the channel.
