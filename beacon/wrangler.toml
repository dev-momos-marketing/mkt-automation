name = "momos-beacon"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Every 30 minutes (:00 and :30): read the Leads Salesforce got in the 30 minutes before
# and post the legit ones. Keep in step with EVERY_MINUTES in src/index.ts.
[triggers]
crons = ["0,30 * * * *"]

# One log line per new lead: Worker > Observability > Logs.
[observability]
enabled = true

[vars]
# Momos org. Lightning is fun-ruby-7024.lightning.force.com, the API lives on my.salesforce.com.
SF_DOMAIN = "https://fun-ruby-7024.my.salesforce.com"
SLACK_CHANNEL_ID = "C0XXXXXXXXX" # #partner-deals. Right-click the channel > View channel details, ID at the bottom.
# Leads with these Status values are never posted.
SKIP_STATUSES = "Unqualified,Junk,Spam,Disqualified"
# Our own people, never posted.
INTERNAL_DOMAINS = "momos.com,momos.io"
# More legit leads than this in one run (an import): one summary message instead of a card each.
BATCH_SIZE = "10"

# Secrets (Worker > Settings > Variables and Secrets, never commit):
#   SF_CLIENT_ID       Consumer Key of the Salesforce app
#   SF_CLIENT_SECRET   Consumer Secret of the Salesforce app
#   SLACK_BOT_TOKEN    Beacon's Bot User OAuth Token (xoxb-...)
