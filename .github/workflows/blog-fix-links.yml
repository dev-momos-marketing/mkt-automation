# Blog fix links: fixes the dead links listed in blog-migration/link-fixes.json, in the Blog and
# Glossary collections (English and translations). A dry run unless "apply" is ticked; a push that
# changes link-fixes.json runs the dry run. Never publishes. See blog-migration/README.md.
name: Blog fix links

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Fix the links (leave unticked for a dry run)
        type: boolean
        default: false
  push:
    branches-ignore: [main]
    paths:
      - blog-migration/link-fixes.json
      - blog-migration/scripts/fix-links.mjs
      - blog-migration/scripts/fixlinks.mjs

permissions:
  contents: read

concurrency:
  group: blog-framer-writes
  cancel-in-progress: false

defaults:
  run:
    working-directory: blog-migration

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      FRAMER_PROJECT_URL: ${{ vars.FRAMER_PROJECT_URL || secrets.FRAMER_PROJECT_URL || 'https://framer.com/projects/Momos-Website-2025--g23b4Eds5wkUvpvpnYbL-8Quzu' }}
      FRAMER_API_KEY: ${{ secrets.FRAMER_API_KEY }}
      BLOG_COLLECTION: ${{ vars.BLOG_COLLECTION }}
      GLOSSARY_COLLECTION: ${{ vars.GLOSSARY_COLLECTION }}
      APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply && '--apply' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blog-migration/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Fix the links
        run: |
          set -o pipefail
          if [ -z "$FRAMER_API_KEY" ]; then
            echo "::error::Add the FRAMER_API_KEY repository secret. See blog-migration/README.md."
            exit 1
          fi
          status=0
          npm run -s fix-links -- $APPLY 2>&1 | tee fix-links.log || status=$?
          mode="dry run"; [ -n "$APPLY" ] && mode="applied"
          { echo "## Blog fix links ($mode)"; echo; sed 's/^/- /' fix-links.log; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blog-fix-links
          path: blog-migration/out/fix-links/
          retention-days: 30
          if-no-files-found: ignore
