# Blog internal linking: adds a few links per post to other blog posts and glossary terms where their
# topic is mentioned (English text). A dry run unless "apply" is ticked. Never publishes. See
# blog-migration/README.md.
name: Blog links

on:
  workflow_dispatch:
    inputs:
      posts:
        description: Post slugs, separated by commas (or "all")
        type: string
        default: all
        required: true
      max:
        description: New links per post, at most
        type: number
        default: 4
      apply:
        description: Add the links (leave unticked for a dry run)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: blog-framer-writes
  cancel-in-progress: false

defaults:
  run:
    working-directory: blog-migration

jobs:
  links:
    runs-on: ubuntu-latest
    env:
      FRAMER_PROJECT_URL: ${{ vars.FRAMER_PROJECT_URL || secrets.FRAMER_PROJECT_URL || 'https://framer.com/projects/Momos-Website-2025--g23b4Eds5wkUvpvpnYbL-8Quzu' }}
      FRAMER_API_KEY: ${{ secrets.FRAMER_API_KEY }}
      BLOG_COLLECTION: ${{ vars.BLOG_COLLECTION }}
      BLOG_CONTENT_FIELD: ${{ vars.BLOG_CONTENT_FIELD }}
      BLOG_MIGRATED_FIELD: ${{ vars.BLOG_MIGRATED_FIELD }}
      POSTS: ${{ inputs.posts }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blog-migration/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Add internal links
        run: |
          set -o pipefail
          if [ -z "$FRAMER_API_KEY" ]; then
            echo "::error::Add the FRAMER_API_KEY repository secret. See blog-migration/README.md."
            exit 1
          fi
          if [ "$(echo "$POSTS" | tr -d ' ')" = "all" ]; then target=(--all); else target=(--posts "$(echo "$POSTS" | tr -d ' ')"); fi
          status=0
          npm run -s links -- "${target[@]}" --max ${{ inputs.max }} ${{ inputs.apply && '--apply' || '' }} 2>&1 | tee links.log || status=$?
          { echo "## Blog links (${{ inputs.apply && 'applied' || 'dry run' }})"; echo; sed 's/^/- /' links.log; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blog-links
          path: blog-migration/out/links/
          retention-days: 30
          if-no-files-found: ignore
