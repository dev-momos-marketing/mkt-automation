# Glossary: checks terms on every pull request, and copies them into Framer's CMS when they reach
# main. Never publishes the site: someone clicks Publish in Framer. See glossary/README.md.
name: Glossary

on:
  pull_request:
    paths: ["glossary/**", ".github/workflows/glossary.yml"]
  push:
    branches: [main]
    paths: ["glossary/**", ".github/workflows/glossary.yml"]
  workflow_dispatch:

# One sync at a time, so two quick merges can't write over each other.
concurrency:
  group: glossary-${{ github.event_name == 'pull_request' && github.ref || 'sync' }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: glossary

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: glossary/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check

  sync:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      FRAMER_PROJECT_URL: ${{ vars.FRAMER_PROJECT_URL }}
      FRAMER_API_KEY: ${{ secrets.FRAMER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: glossary/package-lock.json
      - run: npm ci
      - name: Sync terms to Framer
        run: |
          if [ -z "$FRAMER_PROJECT_URL" ] || [ -z "$FRAMER_API_KEY" ]; then
            echo "::warning::FRAMER_PROJECT_URL or FRAMER_API_KEY isn't set in the repo settings, so nothing was synced. See glossary/README.md."
            exit 0
          fi
          npm run sync
