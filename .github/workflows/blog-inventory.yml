# Blog migration, step 1: lists the Blog collection's fields and posts, the blog template's layers,
# every Embed's code with the post it belongs to (read from the published site), and a dry run of the
# merge with previews, and attaches the result to the run. Only reads. See blog-migration/README.md.
name: Blog inventory

on:
  workflow_dispatch:
  pull_request:
    paths: [blog-migration/**, .github/workflows/blog-inventory.yml]

permissions:
  contents: read

defaults:
  run:
    working-directory: blog-migration

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blog-migration/package-lock.json
      - run: npm ci
      - run: npm test

  inventory:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      # The project link isn't secret; the repo setting (variable or secret) overrides this default.
      FRAMER_PROJECT_URL: ${{ vars.FRAMER_PROJECT_URL || secrets.FRAMER_PROJECT_URL || 'https://framer.com/projects/Momos-Website-2025--g23b4Eds5wkUvpvpnYbL-8Quzu' }}
      FRAMER_API_KEY: ${{ secrets.FRAMER_API_KEY }}
      BLOG_COLLECTION: ${{ vars.BLOG_COLLECTION }}
      BLOG_MAX_SECTION: ${{ vars.BLOG_MAX_SECTION }}
      BLOG_TEMPLATE_PATH: ${{ vars.BLOG_TEMPLATE_PATH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blog-migration/package-lock.json
      - run: npm ci
      - name: Read the blog from Framer
        run: |
          if [ -z "$FRAMER_API_KEY" ]; then
            echo "::error::The FRAMER_API_KEY secret isn't reaching this run. Add it under mkt-automation → Settings → Secrets and variables → Actions → Secrets → Repository secrets (not Environment secrets, not the glossary repo), named exactly FRAMER_API_KEY. See blog-migration/README.md."
            exit 1
          fi
          echo "Framer project: $FRAMER_PROJECT_URL"
          # Show the summary and keep the files even when part of the inventory fails.
          status=0
          npm run inventory || status=$?
          # Every embed's code, post and place, from the template code published on momos.com.
          npm run embeds || status=$?
          # Every post merged into one body, in every language, with previews. Writes nothing to Framer.
          if [ -f out/blog-items.json ] && [ -f out/live/embeds.json ]; then npm run dryrun || status=$?; fi
          if [ -f out/summary.md ]; then cat out/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blog-inventory
          path: blog-migration/out/
          retention-days: 30
