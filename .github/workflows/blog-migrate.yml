# Blog migration, step 5: writes the chosen posts' merged body into Content and Embeds and switches
# Migrated on (or off again with "undo"). A dry run unless "apply" is ticked. Never publishes. See
# blog-migration/README.md.
name: Blog migrate

on:
  workflow_dispatch:
    inputs:
      posts:
        description: Post slugs, separated by commas (or "all")
        type: string
        required: true
      apply:
        description: Write the posts (leave unticked for a dry run)
        type: boolean
        default: false
      undo:
        description: Switch Migrated off again for these posts (keeps Content)
        type: boolean
        default: false
      overwrite:
        description: Replace Content that already has something in it
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: blog-framer-writes
  cancel-in-progress: false

defaults:
  run:
    working-directory: blog-migration

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      FRAMER_PROJECT_URL: ${{ vars.FRAMER_PROJECT_URL || secrets.FRAMER_PROJECT_URL || 'https://framer.com/projects/Momos-Website-2025--g23b4Eds5wkUvpvpnYbL-8Quzu' }}
      FRAMER_API_KEY: ${{ secrets.FRAMER_API_KEY }}
      BLOG_COLLECTION: ${{ vars.BLOG_COLLECTION }}
      BLOG_MAX_SECTION: ${{ vars.BLOG_MAX_SECTION }}
      BLOG_CONTENT_FIELD: ${{ vars.BLOG_CONTENT_FIELD }}
      BLOG_EMBEDS_FIELD: ${{ vars.BLOG_EMBEDS_FIELD }}
      BLOG_MIGRATED_FIELD: ${{ vars.BLOG_MIGRATED_FIELD }}
      POSTS: ${{ inputs.posts }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blog-migration/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Migrate the posts
        run: |
          set -o pipefail
          if [ -z "$FRAMER_API_KEY" ]; then
            echo "::error::Add the FRAMER_API_KEY repository secret. See blog-migration/README.md."
            exit 1
          fi
          if [ "$(echo "$POSTS" | tr -d ' ')" = "all" ]; then target=(--all); else target=(--posts "$(echo "$POSTS" | tr -d ' ')"); fi
          status=0
          npm run -s migrate -- "${target[@]}" ${{ inputs.apply && '--apply' || '' }} ${{ inputs.undo && '--undo' || '' }} ${{ inputs.overwrite && '--overwrite' || '' }} 2>&1 | tee migrate.log || status=$?
          { echo "## Blog migrate (${{ inputs.apply && 'applied' || 'dry run' }}${{ inputs.undo && ', undo' || '' }})"; echo; sed 's/^/- /' migrate.log; } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blog-migrate
          path: blog-migration/out/migrate/
          retention-days: 30
          if-no-files-found: ignore
